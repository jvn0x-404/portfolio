<svg width="840" height="1260" viewBox="0 0 840 1260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jeevan Kumar portrait card</title>
  <desc id="desc">Editorial portrait card with a JK monogram and camera metadata.</desc>
  <defs>
    <linearGradient id="background" x1="420" y1="0" x2="420" y2="1260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AA3B2"/>
      <stop offset="0.55" stop-color="#5A6675"/>
      <stop offset="1" stop-color="#2C333D"/>
    </linearGradient>
    <linearGradient id="shade" x1="420" y1="680" x2="420" y2="1260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1018" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1018" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="840" height="1260" fill="url(#background)"/>
  <circle cx="420" cy="540" r="270" fill="#DCE5F2" fill-opacity="0.08" filter="url(#glow)"/>
  <path d="M0 0H840V1260H0V0Z" fill="url(#shade)"/>

  <g opacity="0.14" stroke="#FFFFFF">
    <path d="M0 160H840"/>
    <path d="M0 320H840"/>
    <path d="M0 480H840"/>
    <path d="M0 640H840"/>
    <path d="M0 800H840"/>
    <path d="M0 960H840"/>
  </g>

  <text x="420" y="665" fill="#FFFFFF" fill-opacity="0.92" font-family="Arial, Helvetica, sans-serif" font-size="330" font-weight="900" letter-spacing="-26" text-anchor="middle">JK</text>

  <g fill="#FFFFFF" font-family="monospace">
    <text x="48" y="64" font-size="18" letter-spacing="4" fill-opacity="0.62">PORTRAIT // 2025</text>
    <text x="792" y="64" font-size="18" letter-spacing="3" text-anchor="end" fill-opacity="0.62">ISO 400</text>
    <text x="48" y="1110" font-size="16" letter-spacing="4" fill-opacity="0.62">JEEVAN KUMAR</text>
    <text x="792" y="1110" font-size="15" letter-spacing="3" text-anchor="end" fill-opacity="0.52">35MM · F2.0</text>
    <text x="48" y="1152" font-size="13" letter-spacing="3" fill-opacity="0.46">SECURE_MODE: ON</text>
    <text x="792" y="1152" font-size="13" letter-spacing="3" text-anchor="end" fill-opacity="0.46">ENCRYPTED</text>
  </g>

  <path d="M48 1070H792" stroke="#FFFFFF" stroke-opacity="0.22"/>
  <path d="M0 185H840" stroke="#FFFFFF" stroke-opacity="0.35"/>
  <circle cx="65" cy="1110" r="5" fill="#34D399"/>
</svg>
